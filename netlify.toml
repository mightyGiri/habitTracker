[build]
  command = "ng build --configuration production"
  publish = "dist/habitTracker/browser"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["dist/habitTracker/browser/**", "dist/habitTracker/server/**"]
  external_node_modules = [
    "@angular/animations",
    "@angular/common",
    "@angular/compiler",
    "@angular/core",
    "@angular/platform-browser",
    "@angular/platform-server",
    "@angular/router",
    "@angular/ssr",
    "rxjs",
    "tslib",
    "zone.js",
    "express",
    "serverless-http"
  ]

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/ssr"
  status = 200
